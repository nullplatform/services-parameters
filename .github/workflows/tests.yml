name: tests

# shellcheck and the trivy IaC scan run in their own workflows (shellcheck.yml,
# trivy.yml); this one lints and validates the provider install specs and runs
# the worker's tests and type-check.

on:
  pull_request:
    branches: [main]

jobs:
  tofu:
    name: Tofu Lint & Validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: v1.10.6

      - name: tofu fmt
        run: tofu fmt -check -recursive parameters/providers

      # Multi-module repo: one tofu module per provider spec, so init/validate
      # per discovered module rather than at the repo root. Discovery is dynamic,
      # so new providers are covered automatically once committed.
      - name: tofu init + validate (per module)
        run: |
          set -e
          modules=$(find parameters/providers -name versions.tf \
            -not -path '*/.terraform/*' -exec dirname {} \; | sort -u)
          for m in $modules; do
            echo "::group::$m"
            ( cd "$m" && tofu init -backend=false -input=false >/dev/null && tofu validate -no-color )
            echo "::endgroup::"
          done

  worker:
    name: Worker
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type-check
        run: bunx tsc --noEmit -p .

      - name: Run the tests
        run: bun test
